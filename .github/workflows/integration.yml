# Tests inside Visual Studio (test/FsmEditor.IntegrationTests), on the self-hosted Windows runner: a Visual Studio
# installed there, on a logged-in desktop (the tests use real input). The VSIX built from this commit is installed
# into the experimental instance (/rootSuffix:Exp), which the tests start. Never for pull requests: a self-hosted
# runner only runs this repo's own commits.
name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: integration

jobs:
  visual-studio:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # From the release pinned by FSM_COMMON_VERSION in release.yml, over HTTPS (the runner may have no gh).
      - name: Fetch fsm-editor-common, fsm-cli's templates and the schemas
        shell: pwsh
        run: |
          $v = (Select-String -Path .github\workflows\release.yml -Pattern '^\s*FSM_COMMON_VERSION:\s*(\S+)').Matches[0].Groups[1].Value
          $base = "https://github.com/vincedupuis/fsm-editor-common/releases/download/v$v"
          $tmp = Join-Path $env:RUNNER_TEMP "common-$v"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $name = "fsm-editor-common-$v-windows-x64"
          Invoke-WebRequest "$base/$name.zip" -OutFile "$tmp\$name.zip"
          Expand-Archive -Force "$tmp\$name.zip" -DestinationPath $tmp
          New-Item -ItemType Directory -Force src\FsmEditor.Vsix\cli | Out-Null
          Copy-Item -Recurse -Force "$tmp\$name\*" src\FsmEditor.Vsix\cli
          foreach ($part in 'templates', 'schemas', 'api-cases') {
            Invoke-WebRequest "$base/fsm-editor-common-$part-$v.tar.gz" -OutFile "$tmp\$part.tar.gz"
            tar xzf "$tmp\$part.tar.gz" -C src\FsmEditor.Vsix\cli
          }

      - name: Build the VSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild src\FsmEditor.Vsix\FsmEditor.Vsix.csproj /restore /p:Configuration=Release /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'the VSIX build failed' }

      - name: Install the VSIX into the experimental instance
        shell: pwsh
        run: |
          # An experimental instance left open by an earlier run would hold the extension's files.
          Get-CimInstance Win32_Process -Filter "Name = 'devenv.exe'" | Where-Object { $_.CommandLine -match '/rootsuffix Exp' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
          $installer = "$vs\Common7\IDE\VSIXInstaller.exe"
          [xml]$manifest = Get-Content src\FsmEditor.Vsix\source.extension.vsixmanifest
          $id = $manifest.PackageManifest.Metadata.Identity.Id
          $vsix = (Resolve-Path src\FsmEditor.Vsix\bin\Release\net48\FsmEditor.vsix).Path
          Start-Process $installer -ArgumentList '/quiet', '/rootSuffix:Exp', "/uninstall:$id" -Wait
          $p = Start-Process $installer -ArgumentList '/quiet', '/rootSuffix:Exp', "/logFile:fsm-exp-install.log", "`"$vsix`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:TEMP\fsm-exp-install.log" -Tail 60
            throw "VSIXInstaller exited with $($p.ExitCode)"
          }

      - name: Tests inside Visual Studio
        env:
          FSM_VS_INTEGRATION: '1'
        run: dotnet test test\FsmEditor.IntegrationTests --logger "console;verbosity=normal"

      # What Visual Studio logged, when a test failed: its ActivityLog, and the crashes Windows recorded.
      - name: Visual Studio's logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA\Microsoft\VisualStudio" -Directory -Filter '*Exp' | ForEach-Object {
            $log = Join-Path $_.FullName 'ActivityLog.xml'
            if (Test-Path $log) {
              Write-Host "== $log"
              [xml]$x = Get-Content $log
              $x.activity.entry | Where-Object { $_.type -ne 'Information' } | Select-Object -Last 40 |
                ForEach-Object { Write-Host "$($_.type) $($_.source): $($_.description)" }
            }
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'devenv' } | Select-Object -First 5 | ForEach-Object { Write-Host "== $($_.TimeCreated) $($_.ProviderName)"; Write-Host $_.Message }

