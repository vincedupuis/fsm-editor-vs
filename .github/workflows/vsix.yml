# Builds the VSIX on Windows (the VSSDK packaging steps only run there) and
# publishes it as the "FsmEditor.vsix" artifact of the run.
name: VSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Release of FSM Editor for VS Code whose `fsm` code generator the VSIX bundles.
  FSM_CLI_VERSION: 0.3.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test test/FsmEditor.Core.Tests

      - name: Fetch the fsm code generator
        shell: pwsh
        run: |
          $name = "fsm-$env:FSM_CLI_VERSION-windows-x64"
          Invoke-WebRequest "https://github.com/vincedupuis/fsm-editor-vscode/releases/download/v$env:FSM_CLI_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\fsm.zip"
          Expand-Archive "$env:RUNNER_TEMP\fsm.zip" -DestinationPath $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force src\FsmEditor.Vsix\cli | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\$name\*" src\FsmEditor.Vsix\cli

      - uses: microsoft/setup-msbuild@v2

      - name: Build the VSIX
        run: msbuild src\FsmEditor.Vsix\FsmEditor.Vsix.csproj /restore /p:Configuration=Release /v:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: FsmEditor.vsix
          path: src/FsmEditor.Vsix/bin/Release/net48/FsmEditor.vsix
          if-no-files-found: error
