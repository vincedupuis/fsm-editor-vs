<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 780 324" width="780" height="324">
<title>Groups</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="20" y="20" width="780" height="324" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="50" cy="70" r="10"/></g><g class="vertex v-comment"><path class="shape" d="M100,260 H248 L260,272 V324 H100 Z"/><path class="stroke" d="M248,260 V272 H260" style="stroke-width:1"/><text class="" x="108" y="277" text-anchor="start">Note</text></g><g class="vertex v-state"><rect class="shape" x="100" y="40" width="120" height="50" rx="10"/><text class="name" x="160" y="69" text-anchor="middle">A</text></g><g class="vertex v-state"><rect class="shape" x="260" y="40" width="120" height="50" rx="10"/><text class="name" x="320" y="69" text-anchor="middle">B</text></g><g class="vertex v-state"><rect class="shape" x="100" y="140" width="120" height="50" rx="10"/><text class="name" x="160" y="169" text-anchor="middle">C</text></g><g class="vertex v-choice"><path class="shape" d="M314,150 L328,164 L314,178 L300,164 Z"/></g><g class="vertex v-state"><rect class="shape" x="420" y="40" width="360" height="260" rx="10"/><text class="name" x="600" y="56" text-anchor="middle">P</text><line class="sep" x1="420" y1="64" x2="780" y2="64"/></g><g class="vertex v-state"><rect class="shape" x="440" y="100" width="120" height="50" rx="10"/><text class="name" x="500" y="129" text-anchor="middle">D</text></g><g class="vertex v-state"><rect class="shape" x="600" y="100" width="120" height="50" rx="10"/><text class="name" x="660" y="129" text-anchor="middle">E</text></g><g class="vertex v-state"><rect class="shape" x="440" y="200" width="120" height="50" rx="10"/><text class="name" x="500" y="229" text-anchor="middle">F</text></g><g class="vertex v-entryPoint"><circle class="shape" cx="420" cy="158" r="8"/><text class="activity" x="420" y="178" text-anchor="middle">in</text></g><g class="transition"><path class="line" d="M60,69.5 L100,67.7"/><path class="arrow" d="M91.1,72.2 L100,67.7 L90.7,64.1"/></g>
