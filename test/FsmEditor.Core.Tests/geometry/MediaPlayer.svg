<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 1130 660" width="1130" height="660">
<title>MediaPlayer</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="10" y="0" width="1130" height="660" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="50" cy="110" r="10"/></g><g class="vertex v-comment"><path class="shape" d="M30,480 H228 L240,492 V544 H30 Z"/><path class="stroke" d="M228,480 V492 H240" style="stroke-width:1"/><text class="" x="38" y="497" text-anchor="start">Deep history restores the</text><text class="" x="38" y="511" text-anchor="start">last active playback</text><text class="" x="38" y="525" text-anchor="start">substates</text><text class="" x="38" y="539" text-anchor="start">after a fault is reset.</text></g><g class="vertex v-state"><rect class="shape" x="100" y="80" width="150" height="60" rx="10"/><text class="name" x="175" y="96" text-anchor="middle">Off</text><line class="sep" x1="100" y1="104" x2="250" y2="104"/><text class="activity" x="108" y="118" text-anchor="start">entry / powerDown()</text></g><g class="vertex v-final"><circle class="shape" cx="175" cy="273" r="13"/><circle class="fill" cx="175" cy="273" r="8"/></g><g class="vertex v-state"><rect class="shape" x="340" y="20" width="780" height="500" rx="10"/><text class="name" x="730" y="36" text-anchor="middle">On</text><line class="sep" x1="340" y1="44" x2="1120" y2="44"/><text class="activity" x="348" y="58" text-anchor="start">entry / ampOn()</text><text class="activity" x="348" y="72" text-anchor="start">exit / ampOff()</text><line class="sep" x1="340" y1="78" x2="1120" y2="78"/></g><g class="vertex v-state"><rect class="shape" x="400" y="580" width="150" height="60" rx="10"/><text class="name" x="475" y="596" text-anchor="middle">Fault</text><line class="sep" x1="400" y1="604" x2="550" y2="604"/><text class="activity" x="408" y="618" text-anchor="start">entry / showError()</text></g><g class="vertex v-initial"><circle class="fill" cx="365" cy="148" r="10"/></g><g class="vertex v-deepHistory"><circle class="shape" cx="368" cy="413" r="13"/><text class="glyph" x="368" y="417" text-anchor="middle">H*</text></g><g class="vertex v-state"><rect class="shape" x="400" y="120" width="150" height="56" rx="10"/><text class="name" x="475" y="136" text-anchor="middle">Stopped</text><line class="sep" x1="400" y1="144" x2="550" y2="144"/><text class="activity" x="408" y="158" text-anchor="start">entry / rewind()</text></g><g class="vertex v-state"><rect class="shape" x="600" y="360" width="200" height="70" rx="10"/><text class="name" x="700" y="376" text-anchor="middle">Paused</text><line class="sep" x1="600" y1="384" x2="800" y2="384"/><text class="activity" x="608" y="398" text-anchor="start">do / blinkLed()</text><text class="activity" x="608" y="412" text-anchor="start">volumeChanged /</text><text class="activity" x="608" y="426" text-anchor="start">updateVolume()</text></g><g class="vertex v-choice"><path class="shape" d="M475,300 L489,314 L475,328 L461,314 Z"/></g><g class="vertex v-state"><rect class="shape" x="760" y="96" width="330" height="230" rx="10"/><text class="name" x="925" y="112" text-anchor="middle">Playing</text><line class="sep" x1="760" y1="120" x2="1090" y2="120"/><text class="region-name" x="766" y="132" text-anchor="start">audio</text><line class="sep dashed" x1="760" y1="223" x2="1090" y2="223"/><text class="region-name" x="766" y="235" text-anchor="start">video</text></g><g class="vertex v-exitPoint"><circle class="shape" cx="475" cy="520" r="8"/><path class="stroke" d="M470.04,515.04 L479.96,524.96 M479.96,515.04 L470.04,524.96" style="stroke-width:1.3"/><text class="activity" x="475" y="540" text-anchor="middle">fault</text></g><g class="vertex v-initial"><circle class="fill" cx="790" cy="170" r="10"/></g><g class="vertex v-state"><rect class="shape" x="825" y="145" width="100" height="50" rx="10"/><text class="name" x="875" y="174" text-anchor="middle">Stereo</text></g><g class="vertex v-state"><rect class="shape" x="965" y="145" width="100" height="50" rx="10"/><text class="name" x="1015" y="174" text-anchor="middle">Mono</text></g><g class="vertex v-initial"><circle class="fill" cx="790" cy="275" r="10"/></g><g class="vertex v-state"><rect class="shape" x="825" y="250" width="100" height="50" rx="10"/><text class="name" x="875" y="279" text-anchor="middle">HD</text></g><g class="vertex v-state"><rect class="shape" x="965" y="250" width="100" height="50" rx="10"/><text class="name" x="1015" y="279" text-anchor="middle">SD</text></g><line class="anchor" x1="210.3" y1="480" x2="356" y2="418.1"/><g class="transition"><path class="line" d="M60,110 L100,110"/><path class="arrow" d="M90.9,114.1 L100,110 L90.9,105.9"/></g><g class="transition"><path class="line" d="M250,101 L300,95 L340,111.3"/><path class="arrow" d="M330,111.6 L340,111.3 L333.1,104.1"/><text class="tlabel" x="295.7" y="87.5" text-anchor="middle"><tspan x="295.7" dy="0">powerOn</tspan></text></g><g class="transition"><path class="line" d="M175,140 L175,260"/><path class="arrow" d="M170.9,250.9 L175,260 L179.1,250.9"/><text class="tlabel" x="169" y="204" text-anchor="end"><tspan x="169" dy="0">unplug</tspan></text></g><g class="transition"><path class="line" d="M340,138.5 L300,125 L250,119"/><path class="arrow" d="M259.6,116 L250,119 L258.6,124.1"/><text class="tlabel" x="296.7" y="116.6" text-anchor="middle"><tspan x="296.7" dy="0">powerOff</tspan></text></g><g class="transition"><path class="line" d="M475,528 L475,580"/><path class="arrow" d="M470.9,570.9 L475,580 L479.1,570.9"/></g><g class="transition"><path class="line" d="M375,148 L400,148"/><path class="arrow" d="M390.9,152.1 L400,148 L390.9,143.9"/></g><g class="transition"><path class="line" d="M368,400 L368,165 L400,159.9"/><path class="arrow" d="M391.6,165.4 L400,159.9 L390.3,157.3"/></g><g class="transition"><path class="line" d="M550,158.5 L760,187.9"/><path class="arrow" d="M750.4,190.7 L760,187.9 L751.5,182.6"/><text class="tlabel" x="655.8" y="165.3" text-anchor="middle"><tspan x="655.8" dy="0">play</tspan></text></g><g class="transition"><path class="line" d="M475,176 L475,300"/><path class="arrow" d="M470.9,290.9 L475,300 L479.1,290.9"/><text class="tlabel" x="469" y="242" text-anchor="end"><tspan x="469" dy="0">eject</tspan></text></g><g class="transition"><path class="line" d="M742.8,360 L784.4,326"/><path class="arrow" d="M779.9,334.9 L784.4,326 L774.7,328.6"/><text class="tlabel" x="759.8" y="336.4" text-anchor="end"><tspan x="759.8" dy="0">play</tspan></text></g><g class="transition"><path class="line" d="M668.1,360 L500.5,176"/><path class="arrow" d="M509.7,180 L500.5,176 L503.6,185.5"/><text class="tlabel" x="588.7" y="262" text-anchor="start"><tspan x="588.7" dy="0">stop</tspan></text></g><g class="transition"><path class="line" d="M700,360 L700,250 L536.8,176"/><path class="arrow" d="M546.8,176.1 L536.8,176 L543.4,183.5"/><text class="tlabel" x="671" y="215.2" text-anchor="middle"><tspan x="671" dy="0">after(5m)</tspan><tspan x="671" dy="13">/ saveBookmark()</tspan></text></g><g class="transition"><path class="line" d="M461,314 L430,314 L430,190 L445,176"/><path class="arrow" d="M441.1,185.2 L445,176 L435.5,179.2"/><text class="tlabel" x="424" y="261.2" text-anchor="end"><tspan x="424" dy="0">[else]</tspan><tspan x="424" dy="13">/ openTray()</tspan></text></g><g class="transition"><path class="line" d="M475,328 L475,512"/><path class="arrow" d="M470.9,502.9 L475,512 L479.1,502.9"/><text class="tlabel" x="567" y="424" text-anchor="end"><tspan x="567" dy="0">[isTrayJammed()]</tspan></text></g><g class="transition"><path class="line" d="M887.6,326 L870,380 L800,386.2"/><path class="arrow" d="M808.7,381.3 L800,386.2 L809.5,389.4"/><text class="tlabel" x="862.8" y="372.6" text-anchor="middle"><tspan x="862.8" dy="0">pause</tspan></text></g><g class="transition"><path class="line" d="M800,170 L825,170"/><path class="arrow" d="M815.9,174.1 L825,170 L815.9,165.9"/></g><g class="transition"><path class="line" d="M925,170 L965,170"/><path class="arrow" d="M955.9,174.1 L965,170 L955.9,165.9"/><text class="tlabel" x="945" y="162" text-anchor="middle"><tspan x="945" dy="0">toggleAudio</tspan></text></g><g class="transition"><path class="line" d="M971.3,195 L945,210 L918.8,195"/><path class="arrow" d="M928.7,196 L918.8,195 L924.7,203.1"/><text class="tlabel" x="942" y="202.8" text-anchor="middle"><tspan x="942" dy="0">toggleAudio</tspan></text></g><g class="transition"><path class="line" d="M800,275 L825,275"/><path class="arrow" d="M815.9,279.1 L825,275 L815.9,270.9"/></g><g class="transition"><path class="line" d="M925,275 L965,275"/><path class="arrow" d="M955.9,279.1 L965,275 L955.9,270.9"/><text class="tlabel" x="945" y="267" text-anchor="middle"><tspan x="945" dy="0">lowBandwidth</tspan></text></g><g class="transition"><path class="line" d="M968.9,300 L945,313 L921.1,300"/><path class="arrow" d="M931,300.8 L921.1,300 L927.1,307.9"/><text class="tlabel" x="942.1" y="305.7" text-anchor="middle"><tspan x="942.1" dy="0">highBandwidth</tspan></text></g><g class="transition"><path class="line" d="M400,610 L300,610 L300,413 L355,413"/><path class="arrow" d="M345.9,417.1 L355,413 L345.9,408.9"/><text class="tlabel" x="294" y="538" text-anchor="end"><tspan x="294" dy="0">reset</tspan></text></g>
