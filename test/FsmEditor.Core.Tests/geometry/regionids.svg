<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 640 500" width="640" height="500">
<title>RegionIds</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="0" y="-20" width="640" height="500" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="30" cy="30" r="10"/></g><g class="vertex v-state"><rect class="shape" x="80" y="0" width="120" height="60" rx="10"/><text class="name" x="140" y="34" text-anchor="middle">A</text></g><g class="vertex v-state"><rect class="shape" x="260" y="0" width="160" height="120" rx="10"/><text class="name" x="340" y="16" text-anchor="middle">D</text><line class="sep" x1="260" y1="24" x2="420" y2="24"/></g><g class="vertex v-state"><rect class="shape" x="460" y="0" width="160" height="120" rx="10"/><text class="name" x="540" y="16" text-anchor="middle">E</text><line class="sep" x1="460" y1="24" x2="620" y2="24"/></g><g class="vertex v-initial"><circle class="fill" cx="30" cy="230" r="10"/></g><g class="vertex v-state"><rect class="shape" x="260" y="224" width="160" height="96" rx="10"/><text class="name" x="340" y="276" text-anchor="middle">B</text></g><g class="vertex v-state"><rect class="shape" x="260" y="200" width="160" height="120" rx="10"/><text class="name" x="340" y="216" text-anchor="middle">F</text><line class="sep" x1="260" y1="224" x2="420" y2="224"/></g><g class="vertex v-state"><rect class="shape" x="460" y="200" width="160" height="120" rx="10"/><text class="name" x="540" y="216" text-anchor="middle">G</text><line class="sep" x1="460" y1="224" x2="620" y2="224"/></g><g class="vertex v-state"><rect class="shape" x="80" y="400" width="120" height="60" rx="10"/><text class="name" x="140" y="434" text-anchor="middle">C</text></g><g class="transition"><path class="line" d="M40,30 L80,30"/><path class="arrow" d="M70.9,34.1 L80,30 L70.9,25.9"/></g><g class="transition"><path class="line" d="M200,39 L260,48"/><path class="arrow" d="M250.4,50.7 L260,48 L251.6,42.6"/><text class="tlabel" x="230.9" y="35.6" text-anchor="middle"><tspan x="230.9" dy="0">e</tspan></text></g><g class="transition"><path class="line" d="M420,60 L460,60"/><path class="arrow" d="M450.9,64.1 L460,60 L450.9,55.9"/><text class="tlabel" x="440" y="52" text-anchor="middle"><tspan x="440" dy="0">e</tspan></text></g><g class="transition"><path class="line" d="M39.9,231.3 L260,261.2"/><path class="arrow" d="M250.4,264 L260,261.2 L251.5,255.9"/></g><g class="transition"><path class="line" d="M340,224 L340,320"/><path class="arrow" d="M335.9,310.9 L340,320 L344.1,310.9"/><text class="tlabel" x="334" y="276" text-anchor="end"><tspan x="334" dy="0">e</tspan></text></g><g class="transition"><path class="line" d="M420,260 L460,260"/><path class="arrow" d="M450.9,264.1 L460,260 L450.9,255.9"/><text class="tlabel" x="440" y="252" text-anchor="middle"><tspan x="440" dy="0">e</tspan></text></g>
</svg>
