<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 560 150" width="560" height="150">
<title>Infinite</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="0" y="-50" width="560" height="150" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="30" cy="50" r="10"/></g><g class="vertex v-state"><rect class="shape" x="80" y="20" width="140" height="60" rx="10"/><text class="name" x="150" y="54" text-anchor="middle">A</text></g><g class="vertex v-state"><rect class="shape" x="400" y="20" width="140" height="60" rx="10"/><text class="name" x="470" y="54" text-anchor="middle">B</text></g><g class="transition"><path class="line" d="M40,50 L80,50"/><path class="arrow" d="M70.9,54.1 L80,50 L70.9,45.9"/></g><g class="transition"><path class="line" d="M220,50 L400,50"/><path class="arrow" d="M390.9,54.1 L400,50 L390.9,45.9"/><text class="tlabel" x="310" y="42" text-anchor="middle"><tspan x="310" dy="0">go</tspan></text></g><g class="transition"><path class="line" d="M180.8,20 L180.8,-10 L250,-10 L250,38 L220,38"/><path class="arrow" d="M229.1,33.9 L220,38 L229.1,42.1"/><text class="tlabel" x="239.4" y="-18" text-anchor="middle"><tspan x="239.4" dy="0">tick</tspan></text></g><g class="transition"><path class="line" d="M400,50 L220,50"/><path class="arrow" d="M229.1,45.9 L220,50 L229.1,54.1"/><text class="tlabel" x="310" y="42" text-anchor="middle"><tspan x="310" dy="0">back</tspan></text></g>
</svg>
