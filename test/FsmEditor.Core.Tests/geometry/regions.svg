<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
<title>Regions</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="0" y="0" width="920" height="440" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="30" cy="40" r="10"/></g><g class="vertex v-state"><rect class="shape" x="80" y="20" width="320" height="330" rx="10"/><text class="name" x="240" y="36" text-anchor="middle">Stacked</text><line class="sep" x1="80" y1="44" x2="400" y2="44"/><text class="activity" x="88" y="58" text-anchor="start">entry / start(); log()</text><line class="sep" x1="80" y1="64" x2="400" y2="64"/><text class="region-name" x="86" y="76" text-anchor="start">top</text><line class="sep dashed" x1="80" y1="124" x2="400" y2="124"/><text class="region-name" x="86" y="136" text-anchor="start">middle</text><line class="sep dashed" x1="80" y1="256.5" x2="400" y2="256.5"/><text class="region-name" x="86" y="268.5" text-anchor="start">bottom</text></g><g class="vertex v-state"><rect class="shape" x="440" y="20" width="400" height="200" rx="10"/><text class="name" x="640" y="36" text-anchor="middle">Side</text><line class="sep" x1="440" y1="44" x2="840" y2="44"/><line class="sep dashed" x1="690" y1="44" x2="690" y2="220"/></g><g class="vertex v-state"><rect class="shape" x="440" y="260" width="220" height="160" rx="10"/><text class="name" x="550" y="276" text-anchor="middle">Single</text><line class="sep" x1="440" y1="284" x2="660" y2="284"/></g><g class="vertex v-state"><rect class="shape" x="700" y="260" width="200" height="160" rx="10"/><text class="name" x="800" y="276" text-anchor="middle">Oversized</text><line class="sep" x1="700" y1="284" x2="900" y2="284"/><line class="sep dashed" x1="700" y1="352" x2="900" y2="352"/></g><g class="vertex v-state"><rect class="shape" x="100" y="75" width="100" height="30" rx="10"/><text class="name" x="150" y="94" text-anchor="middle">S1</text></g><g class="vertex v-state"><rect class="shape" x="100" y="150" width="100" height="40" rx="10"/><text class="name" x="150" y="174" text-anchor="middle">S2</text></g><g class="vertex v-state"><rect class="shape" x="100" y="290" width="100" height="40" rx="10"/><text class="name" x="150" y="314" text-anchor="middle">S3</text></g><g class="vertex v-state"><rect class="shape" x="460" y="80" width="100" height="40" rx="10"/><text class="name" x="510" y="104" text-anchor="middle">H1</text></g><g class="vertex v-state"><rect class="shape" x="710" y="80" width="100" height="40" rx="10"/><text class="name" x="760" y="104" text-anchor="middle">H2</text></g><g class="vertex v-state"><rect class="shape" x="460" y="310" width="100" height="40" rx="10"/><text class="name" x="510" y="334" text-anchor="middle">X1</text></g><g class="transition"><path class="line" d="M38.2,45.7 L80,74.5"/><path class="arrow" d="M70.2,72.7 L80,74.5 L74.8,66"/></g>
</svg>
