<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -31 480 279" width="480" height="279">
<title>Grammar</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="-20" y="-31" width="480" height="279" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="10" cy="10" r="10"/></g><g class="vertex v-state"><rect class="shape" x="100" y="0" width="140" height="60" rx="10"/><text class="stereo" x="170" y="13" text-anchor="middle">«1bad»</text><text class="name" x="170" y="28" text-anchor="middle">A</text><line class="sep" x1="100" y1="36" x2="240" y2="36"/><text class="activity" x="108" y="50" text-anchor="start">entry / start(1)</text><text class="activity" x="108" y="64" text-anchor="start">exit / a.b()</text><text class="activity" x="108" y="78" text-anchor="start">do / x() &amp;&amp; y()</text><text class="activity" x="108" y="92" text-anchor="start">after(2s) / defer</text><text class="activity" x="108" y="106" text-anchor="start">go() / defer</text><text class="invariant" x="104" y="74" text-anchor="start">{v &gt; 3}</text></g><g class="vertex v-state"><rect class="shape" x="300" y="10" width="140" height="60" rx="10"/><text class="name" x="370" y="44" text-anchor="middle">B</text></g><g class="vertex v-choice"><path class="shape" d="M214,200 L228,214 L214,228 L200,214 Z"/></g><g class="transition"><path class="line" d="M19.9,11.2 L100,21.3"/><path class="arrow" d="M90.4,24.2 L100,21.3 L91.4,16.1"/></g><g class="transition"><path class="line" d="M240,33.5 L300,36.5"/><path class="arrow" d="M290.7,40.1 L300,36.5 L291.1,32"/><text class="tlabel" x="270.3" y="1" text-anchor="middle"><tspan x="270.3" dy="0">when(x), after(0s), go</tspan><tspan x="270.3" dy="13">[volume &gt; 3]</tspan><tspan x="270.3" dy="13">/ a() &amp;&amp; b()</tspan></text></g><g class="transition"><path class="line" d="M343.1,70 L220.6,206.6"/><path class="arrow" d="M223.7,197.1 L220.6,206.6 L229.7,202.5"/><text class="tlabel" x="277.4" y="132.3" text-anchor="end"><tspan x="277.4" dy="0">[else]</tspan></text></g><g class="transition"><path class="line" d="M211.3,202.7 L177.2,60"/><path class="arrow" d="M183.3,67.9 L177.2,60 L175.3,69.8"/><text class="tlabel" x="200.1" y="134" text-anchor="start"><tspan x="200.1" dy="0">after(2s)</tspan><tspan x="200.1" dy="13">[isOk()]</tspan></text></g><g class="transition"><path class="line" d="M220.6,206.6 L343.1,70"/><path class="arrow" d="M340,79.5 L343.1,70 L334,74.1"/><text class="tlabel" x="277.4" y="132.3" text-anchor="end"><tspan x="277.4" dy="0">[else]</tspan></text></g>
</svg>
