<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -30 824 220" width="824" height="220">
<title>Transitions</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="20" y="-30" width="824" height="220" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="50" cy="50" r="10"/></g><g class="vertex v-state"><rect class="shape" x="100" y="40" width="140" height="60" rx="10"/><text class="name" x="170" y="56" text-anchor="middle">A</text><line class="sep" x1="100" y1="64" x2="240" y2="64"/><text class="activity" x="108" y="78" text-anchor="start">tick</text></g><g class="vertex v-state"><rect class="shape" x="280" y="40" width="140" height="60" rx="10"/><text class="name" x="350" y="74" text-anchor="middle">B</text></g><g class="vertex v-choice"><path class="shape" d="M474,40 L488,54 L474,68 L460,54 Z"/></g><g class="vertex v-state"><rect class="shape" x="528" y="40" width="250" height="130" rx="10"/><text class="name" x="653" y="56" text-anchor="middle">C</text><line class="sep" x1="528" y1="64" x2="778" y2="64"/></g><g class="vertex v-initial"><circle class="fill" cx="568" cy="100" r="10"/></g><g class="vertex v-state"><rect class="shape" x="618" y="90" width="140" height="60" rx="10"/><text class="name" x="688" y="124" text-anchor="middle">Inner</text></g><g class="transition"><path class="line" d="M59.9,51.6 L100,58.3"/><path class="arrow" d="M90.3,60.9 L100,58.3 L91.7,52.8"/></g><g class="transition"><path class="line" d="M240,70 L280,70"/><path class="arrow" d="M270.9,74.1 L280,70 L270.9,65.9"/></g><g class="transition"><path class="line" d="M240,70 L280,70"/><path class="arrow" d="M270.9,74.1 L280,70 L270.9,65.9"/></g><g class="transition"><path class="line" d="M240,70 L280,70"/><path class="arrow" d="M270.9,74.1 L280,70 L270.9,65.9"/><text class="tlabel" x="260" y="62" text-anchor="middle"><tspan x="260" dy="0">l</tspan></text></g><g class="transition"><path class="line" d="M240,70 L280,70"/><path class="arrow" d="M270.9,74.1 L280,70 L270.9,65.9"/><text class="tlabel" x="260" y="62" text-anchor="middle"><tspan x="260" dy="0">e</tspan></text></g><g class="transition"><path class="line" d="M280,70 L240,70"/><path class="arrow" d="M249.1,65.9 L240,70 L249.1,74.1"/><text class="tlabel" x="260" y="62" text-anchor="middle"><tspan x="260" dy="0">after(1s)</tspan></text></g><g class="transition"><path class="line" d="M280,70 L240,70"/><path class="arrow" d="M249.1,65.9 L240,70 L249.1,74.1"/><text class="tlabel" x="260" y="62" text-anchor="middle"><tspan x="260" dy="0">after(2x)</tspan></text></g><g class="transition"><path class="line" d="M460.7,54.7 L240,66.3"/><path class="arrow" d="M248.9,61.8 L240,66.3 L249.3,69.9"/><text class="tlabel" x="350" y="39.5" text-anchor="middle"><tspan x="350" dy="0">after(1s)</tspan><tspan x="350" dy="13">[else]</tspan></text></g><g class="transition"><path class="line" d="M476.3,42.3 L480.2,22 L506,22 L506,48.4 L485.9,51.9"/><path class="arrow" d="M494.2,46.3 L485.9,51.9 L495.6,54.4"/></g><g class="transition"><path class="line" d="M778,105 L824,105"/><circle class="dangling" cx="824" cy="105" r="6"/><path class="dangling" d="M821,102 L827,108 M827,102 L821,108"/><text class="tlabel" x="801" y="97" text-anchor="middle"><tspan x="801" dy="0">x</tspan></text></g><g class="transition"><path class="line" d="M688,170 L688,150"/><path class="arrow" d="M692.1,159.1 L688,150 L683.9,159.1"/><text class="tlabel" x="682" y="164" text-anchor="end"><tspan x="682" dy="0">y</tspan></text></g><g class="transition"><path class="line" d="M577.9,101.6 L618,108.3"/><path class="arrow" d="M608.3,110.9 L618,108.3 L609.7,102.8"/></g>
</svg>
