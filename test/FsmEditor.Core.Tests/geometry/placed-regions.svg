<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 470 250" width="470" height="250">
<title>Regions</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="20" y="20" width="470" height="250" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="50" cy="50" r="10"/></g><g class="vertex v-state"><rect class="shape" x="100" y="40" width="140" height="60" rx="10"/><text class="name" x="170" y="74" text-anchor="middle">A</text></g><g class="vertex v-state"><rect class="shape" x="280" y="40" width="190" height="210" rx="10"/><text class="name" x="375" y="56" text-anchor="middle">O</text><line class="sep" x1="280" y1="64" x2="470" y2="64"/><text class="region-name" x="286" y="76" text-anchor="start">r1</text><line class="sep dashed" x1="280" y1="157" x2="470" y2="157"/><text class="region-name" x="286" y="169" text-anchor="start">left</text></g><g class="vertex v-shallowHistory"><circle class="shape" cx="53" cy="53" r="13"/><text class="glyph" x="53" y="57" text-anchor="middle">H</text></g><g class="vertex v-state"><rect class="shape" x="106" y="40" width="140" height="60" rx="10"/><text class="name" x="176" y="74" text-anchor="middle">B</text></g><g class="vertex v-state"><rect class="shape" x="310" y="90" width="140" height="60" rx="10"/><text class="name" x="380" y="124" text-anchor="middle">X</text></g><g class="vertex v-state"><rect class="shape" x="310" y="170" width="140" height="60" rx="10"/><text class="name" x="380" y="204" text-anchor="middle">Y</text></g><g class="transition"><path class="line" d="M59.9,51.6 L100,58.3"/><path class="arrow" d="M90.3,60.9 L100,58.3 L91.7,52.8"/></g><g class="transition"><path class="line" d="M240,95.6 L280,110.2"/><path class="arrow" d="M270,110.9 L280,110.2 L272.8,103.3"/><text class="tlabel" x="262.1" y="95.3" text-anchor="middle"><tspan x="262.1" dy="0">go</tspan></text></g>
</svg>
