<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 380 304" width="380" height="304">
<title>Anchors</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f;font-size:12px}
.shape{fill:#fdfdfd;stroke:#333;stroke-width:1.4}
.fill{fill:#333}
.stroke{fill:none;stroke:#333;stroke-width:1.6}
.sep{stroke:#333;stroke-width:1;opacity:.8}
.sep.dashed{stroke-dasharray:7 4}
.name{font-weight:600}
.activity,.tlabel{font-size:11px}
.stereo,.region-name{font-size:10px;font-style:italic;opacity:.8}
.invariant{font-size:11px;font-style:italic}
.glyph{font-size:11px;font-weight:700}
.v-comment .shape{fill:#fbf3cf}
.v-comment text{font-size:11px}
.hit{fill:transparent}
.anchor{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.line,.arrow{fill:none;stroke:#333;stroke-width:1.3;stroke-linejoin:round}
.dangling{fill:#fff;stroke:#c00;stroke-width:1.4}
.tlabel{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect x="20" y="40" width="380" height="304" fill="#fff"/>
<g class="vertex v-initial"><circle class="fill" cx="50" cy="110" r="10"/></g><g class="vertex v-comment"><path class="shape" d="M40,260 H198 L210,272 V324 H40 Z"/><path class="stroke" d="M198,260 V272 H210" style="stroke-width:1"/><text class="" x="48" y="277" text-anchor="start">On the machine, a</text><text class="" x="48" y="291" text-anchor="start">region,</text><text class="" x="48" y="305" text-anchor="start">an initial pseudostate</text><text class="" x="48" y="319" text-anchor="start">and its transition.</text></g><g class="vertex v-state"><rect class="shape" x="120" y="60" width="260" height="150" rx="10"/><text class="name" x="250" y="76" text-anchor="middle">C</text><line class="sep" x1="120" y1="84" x2="380" y2="84"/></g><g class="vertex v-initial"><circle class="fill" cx="160" cy="130" r="10"/></g><g class="vertex v-state"><rect class="shape" x="220" y="105" width="120" height="50" rx="10"/><text class="name" x="280" y="134" text-anchor="middle">C1</text></g><line class="anchor" x1="152.6" y1="260" x2="195.7" y2="210"/><line class="anchor" x1="131.9" y1="260" x2="157.9" y2="139.8"/><line class="anchor" x1="138.8" y1="260" x2="195" y2="130"/><g class="transition"><path class="line" d="M59.9,111.2 L120,118.8"/><path class="arrow" d="M110.4,121.7 L120,118.8 L111.4,113.6"/></g><g class="transition"><path class="line" d="M170,130 L220,130"/><path class="arrow" d="M210.9,134.1 L220,130 L210.9,125.9"/></g>
</svg>
